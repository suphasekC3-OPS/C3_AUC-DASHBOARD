<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70" width="120" height="70">
  <defs>
    <!-- Windshield Reflection Gradient -->
    <linearGradient id="windshieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Headlight Beam Gradient -->
    <linearGradient id="headlightBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0" />
    </linearGradient>

    <!-- PEA Purple Gradient -->
    <linearGradient id="peaPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <!-- PEA Gold Gradient -->
    <linearGradient id="peaGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#FFB81C" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>
  </defs>

  <!-- Shadow under vehicle -->
  <ellipse cx="55" cy="65" rx="46" ry="4" fill="rgba(0,0,0,0.35)" />

  <!-- ==================== MASCOT (น้องสว่าง) ==================== -->
  <g id="peaMascot">
    <!-- Body / Shoulder -->
    <path d="M 68 34 C 68 28, 80 28, 86 36 Z" fill="#D6C4B0" stroke="#262626" stroke-width="1.2" />

    <!-- Arm & Waving Orange Glove (OK sign) -->
    <path d="M 82 32 Q 92 27 96 23" fill="none" stroke="#D6C4B0" stroke-width="4.5" stroke-linecap="round" />
    <!-- Glove -->
    <g transform="translate(95, 16)">
      <circle cx="5" cy="5" r="4.5" fill="#F97316" stroke="#262626" stroke-width="1" />
      <path d="M 8 3 Q 11 1 12 4 Q 10 7 7 6" fill="#F97316" stroke="#262626" stroke-width="1" />
      <path d="M 9 6 Q 13 5 13 8 Q 11 10 7 8" fill="#F97316" stroke="#262626" stroke-width="1" />
      <path d="M 3 2 Q 4 -1 7 1" fill="none" stroke="#262626" stroke-width="1" />
    </g>

    <!-- Head / Face -->
    <ellipse cx="74" cy="22" rx="14" ry="12" fill="#FCE7D6" stroke="#262626" stroke-width="1.4" />
    <!-- Cheeks (Blush) -->
    <ellipse cx="64" cy="25" rx="2.5" ry="1.4" fill="#FCA5A5" opacity="0.8" />
    <ellipse cx="83" cy="25" rx="2.5" ry="1.4" fill="#FCA5A5" opacity="0.8" />
    <!-- Winking Left Eye -->
    <path d="M 65 20 Q 68 23 71 20" fill="none" stroke="#262626" stroke-width="1.5" stroke-linecap="round" />
    <!-- Right Open Eye -->
    <circle cx="79" cy="19" r="3.2" fill="#FFFFFF" stroke="#262626" stroke-width="1.2" />
    <circle cx="79" cy="19" r="1.5" fill="#262626" />
    <circle cx="78.2" cy="18.2" r="0.6" fill="#FFFFFF" />
    <!-- Smile -->
    <path d="M 71 24 Q 74 28 77 24" fill="none" stroke="#262626" stroke-width="1.4" stroke-linecap="round" />

    <!-- Yellow Safety Hardhat (หมวกนิรภัย กฟภ.) -->
    <path d="M 59 18 C 59 7, 88 7, 88 18 Z" fill="#FACC15" stroke="#262626" stroke-width="1.4" />
    <!-- Helmet Rim / Visor -->
    <path d="M 56 18 Q 74 15 91 18 L 89 21 Q 73 18 57 21 Z" fill="#EAB308" stroke="#262626" stroke-width="1.2" />
    <!-- Helmet PEA Emblem Badge -->
    <ellipse cx="73.5" cy="13" rx="4" ry="3" fill="#682C91" />
    <text x="73.5" y="14.5" font-family="sans-serif" font-weight="900" font-size="3" fill="#FACC15" text-anchor="middle">PEA</text>
  </g>

  <!-- ==================== PEA SERVICE TRUCK ==================== -->
  <g id="truckBody">
    <!-- Main Cargo/Service Box (Rear - White) -->
    <path d="M 8 18 L 48 18 L 48 55 L 8 55 Z" fill="#FFFFFF" stroke="#262626" stroke-width="1.4" stroke-linejoin="round" />

    <!-- Top Banner "Light for life" -->
    <rect x="9" y="19" width="38" height="6.5" fill="#EDE9FE" />
    <text x="28" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="4.2" fill="#581C87" text-anchor="middle">Light for life</text>

    <!-- Side Awning (กันสาดเปิดบริการ) -->
    <polygon points="6,26 49,26 46,31 9,31" fill="#F3F4F6" stroke="#262626" stroke-width="1" />

    <!-- Service Windows (ช่องชำระค่าไฟฟ้า) -->
    <rect x="12" y="32" width="14" height="10" rx="1" fill="#38BDF8" stroke="#581C87" stroke-width="1.2" />
    <rect x="29" y="32" width="14" height="10" rx="1" fill="#38BDF8" stroke="#581C87" stroke-width="1.2" />
    <text x="19" y="44.2" font-family="sans-serif" font-size="2" fill="#64748B" text-anchor="middle">ชำระค่าไฟ</text>
    <text x="36" y="44.2" font-family="sans-serif" font-size="2" fill="#64748B" text-anchor="middle">ชำระค่าไฟ</text>

    <!-- Small PEA logo on cargo box -->
    <circle cx="27.5" cy="46.5" r="2" fill="#682C91" />
    <text x="27.5" y="47.5" font-family="sans-serif" font-weight="bold" font-size="1.6" fill="#FACC15" text-anchor="middle">PEA</text>

    <!-- Cabin (Front - White) -->
    <path d="M 48 24 L 58 20 C 62 18, 70 19, 72 23 L 83 37 L 85 55 L 48 55 Z" fill="#FFFFFF" stroke="#262626" stroke-width="1.4" stroke-linejoin="round" />

    <!-- Roof Visor (สปอยเลอร์หลังคา กฟภ.) -->
    <path d="M 47 18 L 68 18 C 73 18, 76 22, 75 25 L 48 25 Z" fill="#FFFFFF" stroke="#262626" stroke-width="1.2" />
    <!-- Visor Text "กฟภ. การไฟฟ้าส่วนภูมิภาค" -->
    <ellipse cx="61" cy="20.5" rx="3.5" ry="1.8" fill="#682C91" />
    <text x="61" y="21.5" font-family="sans-serif" font-weight="900" font-size="2" fill="#FFFFFF" text-anchor="middle">PEA</text>
    <text x="61" y="24" font-family="'Prompt', sans-serif" font-weight="bold" font-size="2.2" fill="#581C87" text-anchor="middle">การไฟฟ้าส่วนภูมิภาค</text>

    <!-- Windshield (กระจกหน้ารถโค้ง ลาดเอียงไปข้างหน้า) -->
    <path d="M 57 26 L 69 26 L 80 39 L 57 39 Z" fill="url(#windshieldGrad)" stroke="#262626" stroke-width="1.3" />
    <!-- Windshield reflection lines -->
    <path d="M 64 27 L 74 38" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 60 29 L 66 38" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" opacity="0.4" />

    <!-- Cabin Side Window -->
    <polygon points="50,27 55,27 55,39 50,39" fill="#7DD3FC" stroke="#262626" stroke-width="1" />

    <!-- PEA Official Gold Accent Line across full truck -->
    <rect x="8" y="47.5" width="77" height="2.5" fill="url(#peaGoldGrad)" stroke="#B45309" stroke-width="0.3" />

    <!-- PEA Official Purple Bottom Skirt & Front Bumper -->
    <path d="M 8 50 L 85 50 C 87 50, 89 53, 88 56 L 85 58 L 8 58 Z" fill="url(#peaPurpleGrad)" stroke="#262626" stroke-width="1.2" />

    <!-- Front Grille Emblem Badge (PEA) -->
    <rect x="76" y="50.8" width="7" height="4.5" rx="1.2" fill="#682C91" stroke="#FACC15" stroke-width="0.6" />
    <text x="79.5" y="54" font-family="sans-serif" font-weight="900" font-size="2.6" fill="#FACC15" text-anchor="middle">PEA</text>

    <!-- Call Center 1129 on side -->
    <g transform="translate(14, 46.5)">
      <circle cx="4" cy="2" r="1.5" fill="#D97706" />
      <text x="4" y="2.7" font-family="sans-serif" font-size="1.8" fill="#FFFFFF" text-anchor="middle">☎</text>
      <text x="12" y="3" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="3.8" fill="#D97706">1129</text>
    </g>

    <!-- Round Golden Headlights (ไฟหน้ารถ) -->
    <circle cx="84.5" cy="46" r="2.8" fill="#FEF08A" stroke="#CA8A04" stroke-width="0.8" />
    <circle cx="84.5" cy="46" r="1.6" fill="#FDE047" />

    <!-- Headlight Light Beam Cone (ลำแสงไฟหน้าส่องไปข้างหน้า) -->
    <polygon points="87,44 118,36 118,56 87,48" fill="url(#headlightBeam)" opacity="0.75" />

    <!-- ==================== WHEELS ==================== -->
    <!-- Rear Wheel -->
    <g transform="translate(24, 57)">
      <circle cx="0" cy="0" r="7.5" fill="#1F2937" stroke="#111827" stroke-width="1.2" />
      <circle cx="0" cy="0" r="4.5" fill="#9CA3AF" />
      <circle cx="0" cy="0" r="2.2" fill="#682C91" />
      <!-- Wheel bolts / spokes -->
      <circle cx="0" cy="-3.3" r="0.7" fill="#E5E7EB" />
      <circle cx="0" cy="3.3" r="0.7" fill="#E5E7EB" />
      <circle cx="-3.3" cy="0" r="0.7" fill="#E5E7EB" />
      <circle cx="3.3" cy="0" r="0.7" fill="#E5E7EB" />
    </g>

    <!-- Front Wheel -->
    <g transform="translate(71, 57)">
      <circle cx="0" cy="0" r="7.5" fill="#1F2937" stroke="#111827" stroke-width="1.2" />
      <circle cx="0" cy="0" r="4.5" fill="#9CA3AF" />
      <circle cx="0" cy="0" r="2.2" fill="#682C91" />
      <circle cx="0" cy="-3.3" r="0.7" fill="#E5E7EB" />
      <circle cx="0" cy="3.3" r="0.7" fill="#E5E7EB" />
      <circle cx="-3.3" cy="0" r="0.7" fill="#E5E7EB" />
      <circle cx="3.3" cy="0" r="0.7" fill="#E5E7EB" />
    </g>

    <!-- EV Lightning Energy Indicator ⚡ (สัญลักษณ์รถไฟฟ้า กฟภ.) -->
    <g transform="translate(3, 40) scale(0.8)">
      <path d="M 4 0 L 1 5 L 4 5 L 2 10 L 7 4 L 4 4 Z" fill="#FACC15" stroke="#B45309" stroke-width="0.6">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="0.8s" repeatCount="indefinite" />
      </path>
    </g>
  </g>
</svg>
